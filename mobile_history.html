<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse · 収集履歴</title>
<style>
:root{color-scheme:dark;--bg:#0d111a;--card:#171e2b;--muted:#aab9d0;--line:#2b384d;--accent:#98c3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef4ff;font:15px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 18px 70px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 10px}.brand{font-size:12px;letter-spacing:3px;color:var(--accent)}p{margin:8px 0}.muted,small{color:var(--muted)}button,input,select{font:inherit;border-radius:12px;border:1px solid var(--line);padding:11px 13px;background:var(--card);color:inherit}button{cursor:pointer;min-height:44px}button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}input{min-width:0;flex:1}select{max-width:100%}.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0;overflow-wrap:anywhere}.battle{text-align:left;display:block;width:100%}.battle strong{display:block;font-size:18px;margin:5px 0}.score{color:var(--accent);font-size:17px;margin-top:12px}.pill{font-size:12px;color:#bdd3f4}.section{margin-top:16px}.chart{width:100%;height:auto;display:block;background:#101723;border-radius:12px}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin:10px 0}.event{border-top:1px solid var(--line);padding:12px 0;white-space:pre-wrap;font-size:14px}.comment{padding:10px 0;border-top:1px solid var(--line)}.note{white-space:pre-wrap}.error{color:#ffb4b4}#message{min-height:24px}.range{display:grid;grid-template-columns:1fr 1fr;gap:16px}.range input{width:100%;padding:0;accent-color:#98c3ff}a{color:var(--accent)}[hidden]{display:none!important}
</style>
<main><header><div><div class="brand">LIVEMETRY PULSE</div><h1>収集履歴</h1></div><span class="pill">閲覧専用</span></header>
<div id="listing"><div class="bar"><select id="source" aria-label="収集先"><option value="normal">通常収集</option><option value="top">Top観測</option></select><button id="refresh">更新</button></div><form id="search" class="bar"><input id="query" placeholder="配信者名・IDを検索" aria-label="配信者検索"><button>検索</button></form><p id="count" class="muted"></p><div id="rows" class="cards"></div><div class="bar"><button id="prev">前へ</button><button id="next">次へ</button></div></div>
<div id="detail" hidden><button id="back">← 履歴へ</button><button id="reload">このバトルを更新</button><div id="identity" class="card section"></div><section class="card section"><h2>時間ごとの推移</h2><p class="muted">つまみで表示区間を絞れます。記録のない区間は線をつなぎません。</p><div class="range"><label>表示開始<input id="begin" type="range" min="0" max="99" value="0"></label><label>表示終了<input id="end" type="range" min="1" max="100" value="100"></label></div><p id="window" class="muted"></p><h2>スコア</h2><svg id="score" class="chart" viewBox="0 0 800 300" role="img" aria-label="スコアの時系列"></svg><div id="legend" class="legend"></div><h2>同時視聴者数</h2><svg id="viewers" class="chart" viewBox="0 0 800 230" role="img" aria-label="視聴者数の時系列"></svg></section><section class="card section"><h2>アイテム・チャレンジ</h2><p class="muted">斜線は取得済みイベントの期間です。終了予定と達成通知は区別して表示します。</p><div id="events"></div></section><section class="card section"><h2>メモ</h2><div id="note" class="note"></div></section><section class="card section"><h2>コメント（最新300件まで）</h2><div id="comments"></div></section></div><p id="message" role="status"></p><footer class="muted section">PCの保存済みデータを表示 · 更新ボタンで再読込</footer></main>
<script>
const $=id=>document.getElementById(id), colors=['#9cc8ff','#ffb4bd','#8ce0bc','#e1bbff','#ffe29b','#80dbed'];let page=0,current=null,request=0,selection=null;
const time=t=>new Date(t*1000).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const status={finished:'終了通知あり',timeout_fallback:'時間で終了判定',interrupted:'途中終了',active:'終了未検知'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function scores(v){return Object.entries(v).map(([k,n])=>k+': '+(n===null?'未取得':n.toLocaleString('ja-JP'))).join(' / ')||'スコア未取得'}
async function api(path,args={}){const r=await fetch(path+'?'+new URLSearchParams({source:$('source').value,...args}));if(r.status===401)throw Error('接続が切れました。PCに表示された接続URLから開き直してください。');const v=await r.json();if(!r.ok)throw Error(v.error||'読み込みに失敗しました');return v}
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':'muted'}
async function list(){const id=++request;message('読み込み中…');try{const v=await api('/api/list',{q:$('query').value,page});if(id!==request)return;$('rows').replaceChildren();for(const r of v.rows){const b=el('button',undefined,'card battle');b.append(el('small',time(r.at)+' · '+(status[r.status]||r.status)),el('strong',r.name),el('div','@'+r.uid,'muted'),el('div',scores(r.scores),'score'));b.onclick=()=>show(r.uid,r.bid);$('rows').append(b)}$('count').textContent=v.count+'件 · '+(page+1)+'ページ';$('prev').disabled=page===0;$('next').disabled=(page+1)*30>=v.count;message(v.message||(!v.rows.length?'該当する履歴はありません。':''))}catch(e){if(id===request)message(e.message,true)}}
async function show(uid,bid){const id=++request;message('バトルを読み込み中…');try{const d=await api('/api/detail',{uid,bid});if(id!==request)return;current=d;selection={uid,bid};$('listing').hidden=true;$('detail').hidden=false;$('identity').replaceChildren(el('h2',d.name),el('div','@'+d.uid,'muted'),el('p',time(d.at)+' · '+(status[d.status]||d.status)),el('div',scores(d.scores),'score'),el('small','バトルID: '+d.bid));$('begin').value=0;$('end').value=100;$('events').replaceChildren();if(d.event_warning)$('events').append(el('p',d.event_warning,'error'));for(const e of d.events)$('events').append(el('div',e.text,'event'));if(!d.events.length)$('events').append(el('p','表示できるイベント記録はありません。','muted'));$('note').textContent=d.note||'メモはありません。';$('comments').replaceChildren();for(const c of d.comments){const div=el('div',undefined,'comment');div.append(el('small',time(c.at)+' · '+c.name),el('div',c.text));$('comments').append(div)}if(!d.comments.length)$('comments').append(el('p','コメント記録はありません。','muted'));draw();message('');window.scrollTo(0,0)}catch(e){if(id===request)message(e.message,true)}}
const ns='http://www.w3.org/2000/svg';function svg(tag,attrs={},text){const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n}
function chart(id,points,lo,hi,height,events){const root=$(id);root.replaceChildren();const left=64,right=780,top=18,bottom=height-38,x=t=>left+(t-lo)/(hi-lo)*(right-left);const visible=points.filter(p=>p.at>=lo&&p.at<=hi), keys=[...new Set(points.flatMap(p=>Object.keys(p.values)))];let max=1;for(const p of visible)for(const v of Object.values(p.values))if(v!==null&&Number.isFinite(v))max=Math.max(max,v);const y=n=>bottom-n/max*(bottom-top);const defs=svg('defs');const pattern=svg('pattern',{id:'hatch-'+id,width:9,height:9,patternUnits:'userSpaceOnUse'});pattern.append(svg('path',{d:'M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7',stroke:'#9cc8ff','stroke-width':1,opacity:.28}));defs.append(pattern);root.append(defs);for(let i=0;i<5;i++){const v=max*i/4;root.append(svg('line',{x1:left,x2:right,y1:y(v),y2:y(v),stroke:'#29364a'}),svg('text',{x:left-8,y:y(v)+4,fill:'#aab9d0','font-size':12,'text-anchor':'end'},Math.round(v).toLocaleString()))}for(let i=0;i<3;i++){const t=lo+(hi-lo)*i/2;root.append(svg('text',{x:x(t),y:height-10,fill:'#aab9d0','font-size':12,'text-anchor':i===0?'start':i===2?'end':'middle'},time(t).split(' ').pop()))}for(const e of events){const finish=e.end??e.at;if(finish<lo||e.at>hi)continue;const a=x(Math.max(lo,e.at)),b=x(Math.min(hi,finish));if(e.end)root.append(svg('rect',{x:a,y:top,width:Math.max(1,b-a),height:bottom-top,fill:'url(#hatch-'+id+')'}));for(const t of [e.at,...(e.end?[e.end]:[])])if(t>=lo&&t<=hi){const line=svg('line',{x1:x(t),x2:x(t),y1:top,y2:bottom,stroke:'#aab9d0','stroke-dasharray':'4 5',opacity:.65});line.append(svg('title',{},e.text));root.append(line)}}keys.forEach((key,i)=>{let prev=null;for(const p of visible){const val=p.values[key];if(val===null||val===undefined){prev=null;continue}if(prev&&p.at-prev.at<=30)root.append(svg('line',{x1:x(prev.at),y1:y(prev.val),x2:x(p.at),y2:y(val),stroke:colors[i%colors.length],'stroke-width':2}));const dot=svg('circle',{cx:x(p.at),cy:y(val),r:2.5,fill:colors[i%colors.length]});dot.append(svg('title',{},time(p.at)+' '+key+': '+val));root.append(dot);prev={at:p.at,val}}});if(!visible.length)root.append(svg('text',{x:400,y:height/2,fill:'#aab9d0','font-size':18,'text-anchor':'middle'},'この区間の記録はありません'));return keys}
function draw(){if(!current)return;const all=[...current.points,...current.viewers];let a=current.at,b=a+1;for(const p of all){a=Math.min(a,p.at);b=Math.max(b,p.at)}for(const e of current.events){a=Math.min(a,e.at);b=Math.max(b,e.end??e.at)}let start=+$('begin').value,end=+$('end').value;if(start>=end){end=start+1;$('end').value=end}const lo=a+(b-a)*start/100,hi=a+(b-a)*end/100;$('window').textContent=time(lo)+' ～ '+time(hi);const keys=chart('score',current.points,lo,hi,300,current.events);chart('viewers',current.viewers,lo,hi,230,[]);$('legend').replaceChildren();keys.forEach((k,i)=>{const n=el('span','● '+k);n.style.color=colors[i%colors.length];$('legend').append(n)})}
$('begin').oninput=draw;$('end').oninput=()=>{if(+$('end').value<=+$('begin').value)$('begin').value=+$('end').value-1;draw()};$('back').onclick=()=>{++request;$('detail').hidden=true;$('listing').hidden=false;message('')};$('reload').onclick=()=>selection&&show(selection.uid,selection.bid);$('source').onchange=()=>{page=0;list()};$('search').onsubmit=e=>{e.preventDefault();page=0;list()};$('refresh').onclick=list;$('prev').onclick=()=>{page--;list()};$('next').onclick=()=>{page++;list()};list();
</script></html>
